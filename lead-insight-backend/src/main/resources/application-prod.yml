# =============================================================================
# 生产环境（Linux 部署，java -jar）—— 全部经环境变量注入，禁止写死密钥
# R1 不使用该 profile；保留以保证配置分层完整
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/lead_insight?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

jwt:
  secret: ${JWT_SECRET:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    com.leadinsight: info
  file:
    name: ${LOG_FILE:logs/lead-insight.log}
