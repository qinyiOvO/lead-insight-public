# =============================================================================
# .github/workflows/secret-scan.yml — CI 兜底密钥扫描（第三道防线）
# 作用：本地 hook 可被 --no-verify 绕过；本工作流在每次 push/PR 时由 GitHub
#       独立复扫全历史，发现的泄露会直接标记为失败，无法合入。
# 工具：gitleaks-action（MIT）https://github.com/gitleaks/gitleaks-action
# =============================================================================
name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks 全历史扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（需全历史才能扫到旧提交）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
