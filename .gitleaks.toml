# =============================================================================
# .gitleaks.toml — 密钥泄露检测配置（gitleaks v8.x）
# 项目：企业销售线索智能识别与跟进优先级排序系统（毕业设计）
# 工具：gitleaks（MIT，27k+ stars）https://github.com/gitleaks/gitleaks
#
# 用法：
#   全量扫描历史：gitleaks git --config .gitleaks.toml --verbose
#   提交前扫描：  gitleaks git --staged --config .gitleaks.toml --verbose
#   目录扫描：    gitleaks dir . --config .gitleaks.toml --verbose
# =============================================================================

title = "lead-insight-gitleaks-config"

[extend]
# 继承官方默认规则集（150+ 内置规则：AWS/GitHub Token/私钥/JWT/数据库连接串等）
useDefault = true

# -----------------------------------------------------------------------------
# 项目自定义规则（官方规则集未覆盖的部分）
# -----------------------------------------------------------------------------

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API Key（sk- 前缀 + 长随机串，本项目的唯一计费凭证）"
regex = '''\bsk-[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-"]
entropy = 3.0

# --- 国内云厂商（gitleaks 官方规则集覆盖较弱，按社区实测反馈补充）---

[[rules]]
id = "aliyun-access-key-id"
description = "阿里云 AccessKey ID（LTAI 前缀）"
regex = '''\bLTAI[A-Za-z0-9]{12,20}\b'''
keywords = ["LTAI"]

[[rules]]
id = "tencentcloud-secret-id"
description = "腾讯云 SecretId（AKID 前缀）"
regex = '''\bAKID[A-Za-z0-9]{13,32}\b'''
keywords = ["AKID"]

[[rules]]
id = "generic-secret-assignment-cn"
description = "配置/代码中出现的中文语境密钥赋值（secretKey/accessKey/私钥等）"
regex = '''(?i)(secret[_-]?key|access[_-]?key|app[_-]?secret|private[_-]?key|access[_-]?token)\s*[:=]\s*["'][A-Za-z0-9+/=_-]{20,}["']'''
keywords = ["secretkey", "secret-key", "accesskey", "access-key", "appsecret", "app-secret"]
entropy = 3.5

[[rules]]
id = "generic-api-key-assignment"
description = "代码/配置中直接赋值的 API Key（带引号的字面量形式，非占位符）"
# 注意：gitleaks 使用 Go RE2 引擎，不支持 (?!...) 负向先行断言，故用「引号+长度+熵」约束
regex = '''(?i)(api[_-]?key|apikey|access[_-]?token|secret[_-]?key)\s*[:=]\s*["'][A-Za-z0-9_\-]{16,}["']'''
keywords = ["api-key", "apikey", "access-token", "secret-key"]
entropy = 3.5

[[rules]]
id = "spring-literal-secret"
description = "Spring 配置中的字面量密钥（带引号的长值；占位符 ${VAR} 因不带引号天然不匹配）"
regex = '''(?i)^\s*(secret|password|api-key|private-key)\s*:\s*["'][A-Za-z0-9+/=_\-]{16,}["']\s*$'''
keywords = ["secret:", "password:", "api-key:"]

# -----------------------------------------------------------------------------
# 白名单（Allowlist）——以下内容属于设计内、允许提交，不视为泄露
# -----------------------------------------------------------------------------
[allowlist]
description = "项目白名单：模板占位符、演示凭据、文档示例"

# 路径白名单
paths = [
  '''application-local\.yml\.example$''',   # 模板文件，只含占位符
  '''application-local\.ya?ml$''',          # 真实本地配置：已被 .gitignore 排除（双重保险：文件名还会被 pre-commit 防线1 硬拦），
                                            # 若不清除，用户填入真 key 后本地 dir 扫描会天天误报，反而训练出「无视告警」的坏习惯
  '''\.gitleaks\.toml$''',                  # 本配置文件自身含规则示例
  '''\.gitleaksignore$''',
  '''target/''',
  '''node_modules/''',
  # 注意：这里**刻意不白名单 docs/**。
  # 曾把 docs/.*密钥.*\.md$ 与 docs/decisions/.*\.md$ 加进来（理由"说明性示例/裁定留痕"），
  # 但那等于"因为它是讲密钥的文档，所以不检查它"——是最危险的盲区：
  # 一旦哪天空白折叠/复制粘贴把真 key 带进文档，扫描器会静默放行。
  # 已实测这两份文档在撤销白名单后无命中，故撤销；文档里的示意串改由下方 regexes 精确放行。
]

# 内容白名单（正则）
regexes = [
  '''\$\{DEEPSEEK_API_KEY:\}''',           # 环境变量占位符
  '''\$\{JWT_SECRET:\}''',
  '''sk-xxx''',                             # 文档中的示意写法
  '''your[_-]?api[_-]?key''',
  '''<YOUR_API_KEY>''',
  '''eyJ[A-Za-z0-9_\-]{4,}\.{2,}''',        # 文档中被截断的 JWT 占位符（如 eyJhbGciOiJIUzI1NiJ9... 联调手册示例）
  # 2026-10-31：删除原先的 jwt secret 白名单。它匹配的是 lead-insight-demo，而 application-dev.yml
  # 里实际的字面量是另一串，正则早已失效 → 属于「看起来在防、实际没防」的死规则；且该字面量已按公开仓库
  # 要求移除（改为进程随机密钥 + JWT_SECRET 注入），不再需要白名单。
  # 2026-10-31：同时删除「MySQL 口令」白名单。该口令已从 application-dev.yml 移出
  # （改为 password: ${DB_PASSWORD:}，真值只存在本机 application-local.yml），
  # 正则已无匹配对象 → 留着的唯一效果是「万一哪天有人把它写回仓库，扫描器会静默放行」。
]
